<title>Pumpkin Patch Day</title>

<style id="gate-style">
  :root {
    --cream: #fff7e8;
    --paper: #fffdf7;
    --pumpkin: #f26b1d;
    --barn: #c8323a;
    --leaf: #4f8a3a;
    --sky: #7cc4e8;
    --ink: #3a2412;
    --ink-soft: #7a5a3e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 50% 115%, #ffb067 0 28%, transparent 58%),
      linear-gradient(180deg, var(--sky) 0%, #bfe3f3 45%, var(--cream) 100%);
  }
  .gate {
    width: min(400px, 100%);
    background: var(--paper);
    border-radius: 18px;
    padding: 30px 26px 26px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(58,36,18,.22);
  }
  .gate svg { width: 76px; height: 76px; animation: wobble 3s ease-in-out infinite; }
  @keyframes wobble { 50% { transform: rotate(-6deg) translateY(-4px); } }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 900;
    font-size: 2rem;
    line-height: 1.05;
    margin: 10px 0 6px;
    color: var(--pumpkin);
  }
  p { margin: 0 0 18px; color: var(--ink-soft); font-weight: 600; }
  label { display: block; text-align: left; font-weight: 800; font-size: .9rem; margin-bottom: 6px; }
  input {
    width: 100%;
    font: inherit;
    font-size: 1.05rem;
    padding: 12px 14px;
    border: 2px solid #e8d6bd;
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--pumpkin); box-shadow: 0 0 0 4px rgba(242,107,29,.18); }
  button {
    width: 100%;
    margin-top: 14px;
    font: inherit;
    font-weight: 800;
    font-size: 1.05rem;
    color: #fff;
    background: var(--pumpkin);
    border: 0;
    border-radius: 999px;
    padding: 12px;
    cursor: pointer;
    box-shadow: 0 5px 0 #c94f0e;
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #c94f0e; }
  button:disabled { opacity: .7; cursor: progress; }
  .msg { min-height: 1.4em; margin: 12px 0 0; font-weight: 800; color: var(--barn); }
  .msg.ok { color: var(--leaf); }
  .shake { animation: shake .4s ease; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  @media (prefers-reduced-motion: reduce) { .gate svg, .shake { animation: none; } }
</style>
</head>

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const form = document.getElementById("gate");
  const input = document.getElementById("pw");
  const btn = document.getElementById("go");
  const msg = document.getElementById("msg");

  async function deriveKey(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }

  // iv (12 bytes) followed by ciphertext + tag
  function decrypt(key, bytes) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12));
  }

  async function unlock(key) {
    let data;
    try {
      data = JSON.parse(new TextDecoder().decode(await decrypt(key, b64(PAYLOAD))));
    } catch {
      return false;
    }
    msg.className = "msg ok";
    const names = Object.keys(data.photos);
    let done = 0;
    msg.textContent = `Unwrapping photos… 0/${names.length}`;
    const urls = {};
    await Promise.all(names.map(async (name) => {
      const res = await fetch(data.photos[name]);
      const plain = await decrypt(key, new Uint8Array(await res.arrayBuffer()));
      urls[name] = URL.createObjectURL(new Blob([plain], { type: "image/webp" }));
      msg.textContent = `Unwrapping photos… ${++done}/${names.length}`;
    }));
    window.PHOTO_URLS = urls;
    show(data.html);
    return true;
  }

  // swap the gate for the decrypted gallery, re-creating scripts so they run
  function show(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    document.getElementById("gate-style").remove();
    for (const el of doc.head.children) {
      if (el.tagName === "STYLE" || el.tagName === "LINK") document.head.appendChild(document.importNode(el, true));
    }
    document.body.replaceChildren(...[...doc.body.childNodes].map((n) => document.importNode(n, true)));
    for (const old of document.body.querySelectorAll("script")) {
      const s = document.createElement("script");
      s.textContent = old.textContent;
      old.replaceWith(s);
    }
    window.scrollTo(0, 0);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    msg.className = "msg";
    msg.textContent = "Checking…";
    try {
      const key = await deriveKey(input.value);
      if (await unlock(key)) {
        // remember for this browser tab only, so a refresh doesn't ask again
        try {
          const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
          sessionStorage.setItem("pumpkin-key", btoa(String.fromCharCode(...raw)));
        } catch {}
        return;
      }
      msg.textContent = "Hmm, that's not it. Try again!";
      form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
      input.select();
    } catch (err) {
      msg.textContent = "Something went wrong loading the photos. Please refresh and try again.";
    }
    btn.disabled = false;
  });

  (async () => {
    let saved = null;
    try { saved = sessionStorage.getItem("pumpkin-key"); } catch {}
    if (!saved) return;
    btn.disabled = true;
    const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
    if (!(await unlock(key))) { try { sessionStorage.removeItem("pumpkin-key"); } catch {} btn.disabled = false; }
  })();
</script>
